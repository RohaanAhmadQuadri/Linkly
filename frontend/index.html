<!DOCTYPE html>
<html lang="en">
<head>
    <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%239b8cff'/%3E%3Ctext x='50' y='72' font-size='70' text-anchor='middle' fill='%230b0d14'%3E↗%3C/text%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="logo">↗</div>

        <h1>Link<span>ly.</span></h1>
        <p class="subtitle">Short links. Big possibilities.</p>

        <div class="url-form">
            <input
                id="givenURL"
                type="url"
                placeholder="Paste your long URL here..."
            >
            <button onclick="insert()">Shorten URL <span>→</span></button>
        </div>

        <div class="result-box">
            <p class="result-label">YOUR SHORTENED LINK</p>
            <p id="result">Your link will appear here...</p>
        </div>

        <p class="footer">Simple. Fast. Linkly.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
